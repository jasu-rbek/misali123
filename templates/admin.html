<!DOCTYPE html>
<html lang="kaa">

<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
        <h2>⚙️ Admin Panel</h2>
        <a href="/home">Saytqa qaytıw</a>
    </header>

    <div class="container">
        <div class="admin-box">
            <h3>Jańa telefon qosıw</h3>
            <form method="POST">
                <input type="text" name="brand" placeholder="Brend (mısalı: Samsung)" required>
                <input type="text" name="name" placeholder="Model (mısalı: Galaxy S24)" required>
                <input type="number" name="price" placeholder="Bahası (sum)" required>
                <input type="text" name="image_url" placeholder="Súwret siltemesi (URL)">
                <button type="submit">Qosıw</button>
            </form>
        </div>

        <h3>Bar telefonlar</h3>
        <div class="grid">
            {% for phone in phones %}
            <div class="card">
                <div>
                    {% if phone['image_url'] %}
                    <img src="{{ phone['image_url'] }}" alt="{{ phone['name'] }}">
                    {% endif %}
                    <h4>{{ phone['brand'] }} {{ phone['name'] }}</h4>
                    <p class="price">{{ phone['price'] }} sum</p>
                </div>
                <a class="delete-btn" href="/delete/{{ phone['id'] }}">🗑 Óshiriw</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>

</html>
